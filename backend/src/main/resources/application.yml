spring:
  application:
    name: smarthms-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/smarthms}
    username: ${DATABASE_USERNAME:smarthms}
    password: ${DATABASE_PASSWORD:smarthms_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: ref,hr,sys,emr
    default-schema: public
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
