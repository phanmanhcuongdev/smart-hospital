spring:
  application:
    name: smarthms-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${DB_HOST_PORT:5439}/${POSTGRES_DB:smarthms}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:smarthms}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:change-me-for-local-use}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: ref,hr,sys,emr
    default-schema: public
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
  level:
    root: INFO
    vn.edu.ptit.smarthms: DEBUG

app:
  security:
    session-ttl-hours: ${SMARTHMS_SESSION_TTL_HOURS:8}
